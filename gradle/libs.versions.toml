[versions]
agp = "8.13.0"
kotlin = "2.1.0"
coreKtx = "1.17.0"
appcompat = "1.7.1"
libxposed = "102.0.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
# libxposed public API: only used to compile hooked code, the framework
# provides it at runtime inside the target process.
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed" }
# libxposed service: must be packaged into the APK, because the settings UI
# talks to the framework through XposedServiceHelper to reach the
# framework-owned RemotePreferences that the hooked process reads.
libxposed-service = { module = "io.github.libxposed:service", version.ref = "libxposed" }
